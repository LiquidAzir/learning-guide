<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Periodic table showing the s, p, d, and f blocks">
  <style>.cell{stroke-width:.8}.sym{font-size:9px;font-weight:600}.sm{font-size:8px}</style>
  <!-- group numbers -->
  <g class="small">
    <text x="30" y="16" text-anchor="middle">1</text><text x="70" y="52" text-anchor="middle">2</text>
    <text x="150" y="124" text-anchor="middle">3</text><text x="190" y="124" text-anchor="middle">4</text><text x="230" y="124" text-anchor="middle">5</text><text x="270" y="124" text-anchor="middle">6</text><text x="310" y="124" text-anchor="middle">7</text><text x="350" y="124" text-anchor="middle">8</text><text x="390" y="124" text-anchor="middle">9</text><text x="430" y="124" text-anchor="middle">10</text><text x="470" y="124" text-anchor="middle">11</text><text x="510" y="124" text-anchor="middle">12</text>
    <text x="550" y="52" text-anchor="middle">13</text><text x="590" y="52" text-anchor="middle">14</text><text x="630" y="52" text-anchor="middle">15</text><text x="670" y="52" text-anchor="middle">16</text><text x="710" y="52" text-anchor="middle">17</text><text x="750" y="16" text-anchor="middle">18</text>
  </g>
  <!-- s block: groups 1-2, periods 1-7 -->
  <g class="soft-fill accent">
    <rect x="12" y="20" width="36" height="34" class="cell"/>
    <rect x="12" y="56" width="36" height="34" class="cell"/><rect x="52" y="56" width="36" height="34" class="cell"/>
    <rect x="12" y="92" width="36" height="34" class="cell"/><rect x="52" y="92" width="36" height="34" class="cell"/>
    <rect x="12" y="128" width="36" height="34" class="cell"/><rect x="52" y="128" width="36" height="34" class="cell"/>
    <rect x="12" y="164" width="36" height="34" class="cell"/><rect x="52" y="164" width="36" height="34" class="cell"/>
    <rect x="12" y="200" width="36" height="34" class="cell"/><rect x="52" y="200" width="36" height="34" class="cell"/>
    <rect x="12" y="236" width="36" height="34" class="cell"/><rect x="52" y="236" width="36" height="34" class="cell"/>
    <rect x="732" y="20" width="36" height="34" class="cell"/>
  </g>
  <!-- p block: groups 13-18, periods 2-7 -->
  <g class="amber-soft-fill amber">
    <rect x="532" y="56" width="236" height="34" class="cell"/>
    <rect x="532" y="92" width="236" height="34" class="cell"/>
    <rect x="532" y="128" width="236" height="34" class="cell"/>
    <rect x="532" y="164" width="236" height="34" class="cell"/>
    <rect x="532" y="200" width="236" height="34" class="cell"/>
    <rect x="532" y="236" width="236" height="34" class="cell"/>
  </g>
  <!-- d block: groups 3-12, periods 4-7 -->
  <g class="slate-fill line">
    <rect x="132" y="128" width="396" height="34" class="cell" fill="none"/>
    <rect x="132" y="164" width="396" height="34" class="cell" fill="none"/>
    <rect x="132" y="200" width="396" height="34" class="cell" fill="none"/>
    <rect x="132" y="236" width="396" height="34" class="cell" fill="none"/>
  </g>
  <!-- f block -->
  <g class="line">
    <rect x="132" y="300" width="556" height="34" class="cell" fill="none" stroke-dasharray="4 3"/>
    <rect x="132" y="336" width="556" height="34" class="cell" fill="none" stroke-dasharray="4 3"/>
  </g>
  <!-- grid lines within blocks (vertical) -->
  <g class="line" stroke-width=".6" opacity=".7">
    <path d="M172 128V270M212 128V270M252 128V270M292 128V270M332 128V270M372 128V270M412 128V270M452 128V270M492 128V270"/>
    <path d="M572 56V270M612 56V270M652 56V270M692 56V270M732 56V270"/>
    <path d="M172 300V370M212 300V370M252 300V370M292 300V370M332 300V370M372 300V370M412 300V370M452 300V370M492 300V370M532 300V370M572 300V370M612 300V370M652 300V370"/>
    <path d="M132 162H528M132 198H528M132 234H528M532 90H768M532 126H768M532 162H768M532 198H768M532 234H768M132 334H688"/>
  </g>
  <!-- element symbols (selected) -->
