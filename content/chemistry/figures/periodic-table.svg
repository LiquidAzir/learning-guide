    <text x="30" y="148">K</text><text x="70" y="148">Ca</text><text x="150" y="148">Sc</text><text x="190" y="148">Ti</text><text x="230" y="148">V</text><text x="270" y="148">Cr</text><text x="310" y="148">Mn</text><text x="350" y="148">Fe</text><text x="390" y="148">Co</text><text x="430" y="148">Ni</text><text x="470" y="148">Cu</text><text x="510" y="148">Zn</text><text x="550" y="148">Ga</text><text x="590" y="148">Ge</text><text x="630" y="148">As</text><text x="670" y="148">Se</text><text x="710" y="148">Br</text><text x="750" y="148">Kr</text>
    <text x="30" y="184">Rb</text><text x="70" y="184">Sr</text><text x="150" y="184">Y</text><text x="190" y="184">Zr</text><text x="230" y="184">Nb</text><text x="270" y="184">Mo</text><text x="310" y="184">Tc</text><text x="350" y="184">Ru</text><text x="390" y="184">Rh</text><text x="430" y="184">Pd</text><text x="470" y="184">Ag</text><text x="510" y="184">Cd</text><text x="550" y="184">In</text><text x="590" y="184">Sn</text><text x="630" y="184">Sb</text><text x="670" y="184">Te</text><text x="710" y="184">I</text><text x="750" y="184">Xe</text>
    <text x="30" y="220">Cs</text><text x="70" y="220">Ba</text><text x="150" y="220">Lu</text><text x="190" y="220">Hf</text><text x="230" y="220">Ta</text><text x="270" y="220">W</text><text x="310" y="220">Re</text><text x="350" y="220">Os</text><text x="390" y="220">Ir</text><text x="430" y="220">Pt</text><text x="470" y="220">Au</text><text x="510" y="220">Hg</text><text x="550" y="220">Tl</text><text x="590" y="220">Pb</text><text x="630" y="220">Bi</text><text x="670" y="220">Po</text><text x="710" y="220">At</text><text x="750" y="220">Rn</text>
    <text x="30" y="256">Fr</text><text x="70" y="256">Ra</text><text x="150" y="256">Lr</text><text x="190" y="256">Rf</text><text x="230" y="256">Db</text><text x="270" y="256">Sg</text><text x="310" y="256">Bh</text><text x="350" y="256">Hs</text><text x="390" y="256">Mt</text><text x="430" y="256">Ds</text><text x="470" y="256">Rg</text><text x="510" y="256">Cn</text><text x="550" y="256">Nh</text><text x="590" y="256">Fl</text><text x="630" y="256">Mc</text><text x="670" y="256">Lv</text><text x="710" y="256">Ts</text><text x="750" y="256">Og</text>
    <text x="150" y="320">La</text><text x="190" y="320">Ce</text><text x="230" y="320">Pr</text><text x="270" y="320">Nd</text><text x="310" y="320">Pm</text><text x="350" y="320">Sm</text><text x="390" y="320">Eu</text><text x="430" y="320">Gd</text><text x="470" y="320">Tb</text><text x="510" y="320">Dy</text><text x="550" y="320">Ho</text><text x="590" y="320">Er</text><text x="630" y="320">Tm</text><text x="670" y="320">Yb</text>
    <text x="150" y="356">Ac</text><text x="190" y="356">Th</text><text x="230" y="356">Pa</text><text x="270" y="356">U</text><text x="310" y="356">Np</text><text x="350" y="356">Pu</text><text x="390" y="356">Am</text><text x="430" y="356">Cm</text><text x="470" y="356">Bk</text><text x="510" y="356">Cf</text><text x="550" y="356">Es</text><text x="590" y="356">Fm</text><text x="630" y="356">Md</text><text x="670" y="356">No</text>
  </g>
  <!-- block labels -->
  <text x="50" y="290" text-anchor="middle" class="small" style="font-weight:600">s block · 2 wide</text>
  <text x="330" y="290" text-anchor="middle" class="small" style="font-weight:600">d block · 10 wide (transition metals)</text>
  <text x="650" y="290" text-anchor="middle" class="small" style="font-weight:600">p block · 6 wide</text>
  <text x="410" y="392" text-anchor="middle" class="small" style="font-weight:600">f block · 14 wide (lanthanides and actinides; belong between groups 2 and 3)</text>
  <text x="30" y="410" class="small">Rows are periods (shells filling); columns are groups (same outer-electron arrangement).</text>
  <text x="440" y="410" class="small">Group 1: alkali metals · 17: halogens · 18: noble gases.</text>
</svg>
