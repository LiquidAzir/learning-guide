<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Left: the area under a curve between a and b approximated by six rectangles. Right: the same area with many thin rectangles, nearly filling the region exactly.">
  <g class="axis" fill="none" stroke-width="1.2">
    <line x1="30" y1="270" x2="340" y2="270"/>
    <line x1="30" y1="270" x2="30" y2="40"/>
    <line x1="390" y1="270" x2="700" y2="270"/>
    <line x1="390" y1="270" x2="390" y2="40"/>
  </g>
  <!-- curve f: y = 270 - (60 + 40 sin((x-a)/80) + 0.3(x-a)) roughly; define heights at x offsets -->
  <!-- left: a at x=70, b at x=310, 6 rectangles width 40; heights (screen y of curve at left edge of each) -->
  <g class="soft-fill" stroke="none">
    <rect x="70" y="200" width="40" height="70"/>
    <rect x="110" y="170" width="40" height="100"/>
    <rect x="150" y="150" width="40" height="120"/>
    <rect x="190" y="145" width="40" height="125"/>
    <rect x="230" y="128" width="40" height="142"/>
    <rect x="270" y="100" width="40" height="170"/>
  </g>
  <g class="accent" fill="none" stroke-width="1.2">
    <rect x="70" y="200" width="40" height="70"/>
    <rect x="110" y="170" width="40" height="100"/>
    <rect x="150" y="150" width="40" height="120"/>
    <rect x="190" y="145" width="40" height="125"/>
    <rect x="230" y="128" width="40" height="142"/>
    <rect x="270" y="100" width="40" height="170"/>
  </g>
  <path class="ink" fill="none" stroke-width="2.2" d="M40,215 C90,185 130,155 160,150 C200,143 220,140 250,120 C280,100 300,75 335,60"/>
  <text x="70" y="290" class="lbl small" text-anchor="middle">a</text>
  <text x="310" y="290" class="lbl small" text-anchor="middle">b</text>
  <text x="185" y="310" class="lbl small" text-anchor="middle">6 rectangles: rough</text>
  <text x="330" y="55" class="lbl small" text-anchor="end">f(x)</text>
  <!-- right panel: many thin rectangles, width 8, from x=430 to 670 -->
  <g class="soft-fill" stroke="none">
