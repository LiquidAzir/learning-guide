<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="Diagram of how the main theories of physics contain one another">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted-fill"/></marker>
  </defs>
  <g>
    <rect x="20" y="25" width="150" height="60" rx="6" class="soft-fill accent" stroke-width="1.5"/>
    <text x="95" y="50" text-anchor="middle" style="font-weight:600">Thermodynamics</text>
    <text x="95" y="70" text-anchor="middle" class="small">Carnot to Boltzmann</text>

    <rect x="20" y="120" width="150" height="60" rx="6" class="soft-fill accent" stroke-width="1.5"/>
    <text x="95" y="145" text-anchor="middle" style="font-weight:600">Mechanics</text>
    <text x="95" y="165" text-anchor="middle" class="small">Newton, 1687</text>

    <rect x="20" y="215" width="150" height="60" rx="6" class="soft-fill accent" stroke-width="1.5"/>
    <text x="95" y="240" text-anchor="middle" style="font-weight:600">Electromagnetism</text>
    <text x="95" y="260" text-anchor="middle" class="small">Maxwell, 1865</text>

    <rect x="240" y="120" width="160" height="60" rx="6" class="soft-fill accent" stroke-width="1.5"/>
    <text x="320" y="145" text-anchor="middle" style="font-weight:600">Special relativity</text>
    <text x="320" y="165" text-anchor="middle" class="small">Einstein, 1905</text>

    <rect x="240" y="215" width="160" height="60" rx="6" class="soft-fill accent" stroke-width="1.5"/>
    <text x="320" y="240" text-anchor="middle" style="font-weight:600">Quantum mechanics</text>
    <text x="320" y="260" text-anchor="middle" class="small">1900–1927</text>

    <rect x="470" y="25" width="170" height="60" rx="6" class="soft-fill accent" stroke-width="1.5"/>
    <text x="555" y="50" text-anchor="middle" style="font-weight:600">General relativity</text>
    <text x="555" y="70" text-anchor="middle" class="small">Einstein, 1915</text>

    <rect x="470" y="215" width="170" height="60" rx="6" class="soft-fill accent" stroke-width="1.5"/>
    <text x="555" y="240" text-anchor="middle" style="font-weight:600">Quantum field theory</text>
    <text x="555" y="260" text-anchor="middle" class="small">Standard Model, 1970s</text>

    <rect x="470" y="110" width="170" height="80" rx="6" fill="none" class="amber" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="555" y="140" text-anchor="middle" style="font-weight:600">Quantum gravity</text>
    <text x="555" y="160" text-anchor="middle" class="small">unsolved</text>
    <text x="555" y="176" text-anchor="middle" class="small">strings? loops? something else?</text>
  </g>
  <g class="muted" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M170 150 H236"/>
    <path d="M170 165 L236 228"/>
    <path d="M95 275 V295 H555 V279"/>
    <path d="M400 150 H435 V245 H466"/>
    <path d="M400 245 H466"/>
    <path d="M400 140 L466 74"/>
    <path d="M555 85 V106" stroke-dasharray="6 4"/>
    <path d="M555 215 V194" stroke-dasharray="6 4"/>
    <path d="M170 55 H466" stroke-dasharray="6 4"/>
  </g>
  <text x="203" y="141" text-anchor="middle" class="small">fast</text>
  <text x="183" y="212" text-anchor="middle" class="small">small</text>
  <text x="300" y="290" text-anchor="middle" class="small">quantized</text>
  <text x="455" y="98" text-anchor="middle" class="small">+ gravity</text>
  <text x="320" y="48" text-anchor="middle" class="small">black hole entropy</text>
</svg>
