<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Diagram of the double-slit experiment showing interference bands">
  <defs>
    <linearGradient id="bands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="currentColor" stop-opacity="0.9"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- source -->
  <circle cx="60" cy="150" r="7" class="amber-fill"/>
  <text x="60" y="180" text-anchor="middle" class="small">light source</text>
  <!-- incoming wavefronts (arcs) -->
  <g class="amber" fill="none" stroke-width="1.2" opacity="0.7">
    <path d="M90 105 A45 45 0 0 1 90 195"/>
    <path d="M120 80 A80 80 0 0 1 120 220"/>
    <path d="M150 58 A115 115 0 0 1 150 242"/>
    <path d="M180 40 A150 150 0 0 1 180 260"/>
  </g>
  <!-- barrier with two slits -->
  <g class="ink-fill">
    <rect x="236" y="20" width="8" height="98"/>
    <rect x="236" y="130" width="8" height="40"/>
    <rect x="236" y="182" width="8" height="98"/>
  </g>
  <text x="240" y="14" text-anchor="middle" class="small">two slits</text>
  <!-- wavefronts from each slit -->
  <g class="accent" fill="none" stroke-width="1.1" opacity="0.8">
    <path d="M244 100 A24 24 0 0 1 268 124 A24 24 0 0 1 244 148"/>
    <path d="M244 76 A48 48 0 0 1 292 124 A48 48 0 0 1 244 172"/>
    <path d="M244 52 A72 72 0 0 1 316 124 A72 72 0 0 1 244 196"/>
    <path d="M244 28 A96 96 0 0 1 340 124 A96 96 0 0 1 244 220"/>
    <path d="M244 152 A24 24 0 0 1 268 176 A24 24 0 0 1 244 200"/>
    <path d="M244 128 A48 48 0 0 1 292 176 A48 48 0 0 1 244 224"/>
    <path d="M244 104 A72 72 0 0 1 316 176 A72 72 0 0 1 244 248"/>
    <path d="M244 80 A96 96 0 0 1 340 176 A96 96 0 0 1 244 272"/>
  </g>
  <!-- screen -->
  <rect x="520" y="20" width="10" height="260" class="line" fill="none" stroke-width="1.2"/>
  <g class="accent-fill">
    <rect x="522" y="140" width="6" height="20"/>
    <rect x="522" y="106" width="6" height="16" opacity="0.8"/>
    <rect x="522" y="178" width="6" height="16" opacity="0.8"/>
    <rect x="522" y="76" width="6" height="12" opacity="0.55"/>
    <rect x="522" y="212" width="6" height="12" opacity="0.55"/>
    <rect x="522" y="50" width="6" height="9" opacity="0.35"/>
    <rect x="522" y="241" width="6" height="9" opacity="0.35"/>
    <rect x="522" y="30" width="6" height="6" opacity="0.2"/>
    <rect x="522" y="264" width="6" height="6" opacity="0.2"/>
  </g>
  <text x="525" y="14" text-anchor="middle" class="small">screen</text>
  <!-- intensity curve -->
  <path d="M560 30 C566 30 566 36 570 36 C576 36 574 50 580 50 C588 50 586 76 594 76 C604 76 602 106 612 106 C624 106 620 140 636 140 L636 160 C620 160 624 194 612 194 C602 194 604 224 594 224 C586 224 588 250 580 250 C574 250 576 264 570 264 C566 264 566 270 560 270" fill="none" class="accent" stroke-width="1.5"/>
  <text x="600" y="290" text-anchor="middle" class="small">brightness across the screen</text>
  <text x="712" y="154" text-anchor="end" class="small">bright where waves</text>
  <text x="712" y="168" text-anchor="end" class="small">arrive in step</text>
  <text x="712" y="126" text-anchor="end" class="small">dark where they cancel</text>
</svg>
