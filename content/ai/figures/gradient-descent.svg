<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Left: elliptical contour lines of a loss surface with three descent paths: a good learning rate reaching the center, a large one zigzagging, a tiny one making small steps. Right: three loss-versus-step curves, one falling smoothly, one oscillating, one barely falling.">
  <!-- contours centered (180,150) -->
  <g class="line" fill="none" stroke-width="1.1">
    <ellipse cx="180" cy="150" rx="150" ry="95"/>
    <ellipse cx="180" cy="150" rx="115" ry="72"/>
    <ellipse cx="180" cy="150" rx="82" ry="50"/>
    <ellipse cx="180" cy="150" rx="50" ry="30"/>
    <ellipse cx="180" cy="150" rx="22" ry="13"/>
  </g>
  <circle cx="180" cy="150" r="3.5" class="ink-fill"/>
  <!-- good path (accent): from (40,90) converging -->
  <polyline class="accent" fill="none" stroke-width="2" points="40,90 95,112 135,130 160,142 173,148 179,150"/>
  <g class="accent-fill"><circle cx="40" cy="90" r="3.5"/><circle cx="95" cy="112" r="3"/><circle cx="135" cy="130" r="3"/><circle cx="160" cy="142" r="3"/></g>
  <!-- too large (red): zigzag across the narrow axis -->
  <polyline class="red" fill="none" stroke-width="2" points="300,230 120,60 240,215 130,85 220,200 145,105 205,185"/>
  <g class="red-fill"><circle cx="300" cy="230" r="3.5"/><circle cx="120" cy="60" r="3"/><circle cx="240" cy="215" r="3"/><circle cx="130" cy="85" r="3"/></g>
  <!-- too small (amber): tiny steps from (310,150) -->
  <polyline class="amber" fill="none" stroke-width="2" points="310,150 300,150 291,150 283,150 276,150 270,150 265,150 261,150 258,150"/>
  <g class="amber-fill"><circle cx="310" cy="150" r="3.5"/><circle cx="291" cy="150" r="2.5"/><circle cx="276" cy="150" r="2.5"/><circle cx="265" cy="150" r="2.5"/></g>
  <text x="36" y="80" class="lbl small accent-text">good rate</text>
  <text x="262" y="245" class="lbl small red-text">too high: overshoots</text>
  <text x="290" y="170" class="lbl small amber-text">too low: crawls</text>
  <text x="180" y="280" class="lbl small" text-anchor="middle">loss surface (contours), two parameters</text>
  <!-- right: loss curves -->
  <g class="axis" fill="none" stroke-width="1.2"><path d="M400,250 L700,250 M400,250 L400,40"/></g>
  <text x="550" y="280" class="lbl small" text-anchor="middle">training steps →</text>
  <text x="392" y="46" class="lbl small" text-anchor="end">loss</text>
  <path class="accent" fill="none" stroke-width="2.2" d="M400,70 C440,160 500,215 560,232 C620,242 660,244 700,245"/>
  <path class="red" fill="none" stroke-width="2" d="M400,70 L425,180 L450,95 L475,190 L500,110 L525,195 L550,125 L575,200 L600,140 L625,205 L650,150 L675,205 L700,160"/>
  <path class="amber" fill="none" stroke-width="2" d="M400,70 C500,72 600,80 700,95"/>
  <text x="600" y="228" class="lbl small accent-text">good</text>
  <text x="640" y="135" class="lbl small red-text">oscillating</text>
  <text x="620" y="88" class="lbl small amber-text">barely moving</text>
</svg>
