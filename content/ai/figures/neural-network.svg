<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="A feedforward neural network: three input nodes on the left connected to four hidden nodes, connected to three more hidden nodes, connected to one output node on the right. Arrows show forward flow of information and a reverse arrow shows the gradient flowing back during training.">
  <g class="line" fill="none" stroke-width="1">
    <!-- input (x=90; y 90,150,210) to hidden1 (x=270; y 60,120,180,240) -->
    <path d="M90,90 L270,60 M90,90 L270,120 M90,90 L270,180 M90,90 L270,240 M90,150 L270,60 M90,150 L270,120 M90,150 L270,180 M90,150 L270,240 M90,210 L270,60 M90,210 L270,120 M90,210 L270,180 M90,210 L270,240"/>
    <!-- hidden1 to hidden2 (x=450; y 90,150,210) -->
    <path d="M270,60 L450,90 M270,60 L450,150 M270,60 L450,210 M270,120 L450,90 M270,120 L450,150 M270,120 L450,210 M270,180 L450,90 M270,180 L450,150 M270,180 L450,210 M270,240 L450,90 M270,240 L450,150 M270,240 L450,210"/>
    <!-- hidden2 to output (x=630; y 150) -->
    <path d="M450,90 L630,150 M450,150 L630,150 M450,210 L630,150"/>
  </g>
  <g class="soft-fill accent" stroke-width="1.6">
    <circle cx="90" cy="90" r="16"/><circle cx="90" cy="150" r="16"/><circle cx="90" cy="210" r="16"/>
  </g>
  <g class="amber-soft-fill amber" stroke-width="1.6">
    <circle cx="270" cy="60" r="16"/><circle cx="270" cy="120" r="16"/><circle cx="270" cy="180" r="16"/><circle cx="270" cy="240" r="16"/>
    <circle cx="450" cy="90" r="16"/><circle cx="450" cy="150" r="16"/><circle cx="450" cy="210" r="16"/>
  </g>
  <circle cx="630" cy="150" r="16" class="green-fill" opacity=".85"/>
  <g class="lbl small" text-anchor="middle">
    <text x="90" y="94">x₁</text><text x="90" y="154">x₂</text><text x="90" y="214">x₃</text>
    <text x="630" y="154" fill="#fff">ŷ</text>
    <text x="90" y="275">inputs</text><text x="270" y="275">hidden layer 1</text><text x="450" y="275">hidden layer 2</text><text x="630" y="275">output</text>
    <text x="180" y="30">W₁ (4×3 weights)</text><text x="360" y="30">W₂ (3×4)</text><text x="540" y="30">W₃ (1×3)</text>
  </g>
  <text x="300" y="104" class="lbl small">each node: g(Σwx+b)</text>
  <!-- flow arrows -->
  <defs><marker id="fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="accent-fill"/></marker><marker id="bwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="red-fill"/></marker></defs>
  <line class="accent" x1="120" y1="292" x2="330" y2="292" stroke-width="1.6" marker-end="url(#fwd)"/>
  <text x="225" y="288" class="lbl small accent-text" text-anchor="middle">forward: compute prediction</text>
  <line class="red" x1="600" y1="292" x2="390" y2="292" stroke-width="1.6" marker-end="url(#bwd)"/>
  <text x="495" y="288" class="lbl small red-text" text-anchor="middle">backward: propagate error to every weight</text>
</svg>
