<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Euler diagram of complexity classes: P inside NP inside PSPACE, with the NP-complete problems at the hard edge of NP and NP-hard extending outside PSPACE">
  <!-- NP-hard: dashed, extends beyond PSPACE, contains NP-complete -->
  <ellipse cx="470" cy="120" rx="190" ry="95" fill="none" class="amber" stroke-width="1.8" stroke-dasharray="7 5"/>
  <!-- PSPACE -->
  <ellipse cx="330" cy="190" rx="270" ry="170" class="muted-line" fill="none" stroke-width="1.6"/>
  <!-- NP -->
  <ellipse cx="290" cy="195" rx="195" ry="120" class="soft-fill accent" stroke-width="1.8" opacity="0.9"/>
  <!-- NP-complete -->
  <ellipse cx="390" cy="150" rx="75" ry="45" class="amber-soft-fill amber" stroke-width="1.8"/>
  <!-- P -->
  <ellipse cx="215" cy="205" rx="95" ry="70" class="green-fill green" stroke-width="1.8" opacity="0.35"/>
  <ellipse cx="215" cy="205" rx="95" ry="70" fill="none" class="green" stroke-width="1.8"/>

  <g text-anchor="middle">
    <text class="lbl" x="215" y="196" style="font-weight:700">P</text>
    <text class="lbl small" x="215" y="216">sorting, shortest paths,</text>
    <text class="lbl small" x="215" y="230">primality, matching</text>

    <text class="lbl" x="165" y="120" style="font-weight:700">NP</text>
    <text class="lbl small" x="250" y="288">factoring, graph isomorphism</text>

    <text class="lbl small amber-text" x="390" y="146" style="font-weight:700">NP-complete</text>
    <text class="lbl small" x="390" y="166">SAT, TSP, colouring</text>

    <text class="lbl" x="330" y="330" style="font-weight:700">PSPACE</text>
    <text class="lbl small" x="330" y="350">optimal play in many games</text>

    <text class="lbl small amber-text" x="600" y="56" style="font-weight:700">NP-hard</text>
    <text class="lbl small" x="600" y="74">includes problems</text>
    <text class="lbl small" x="600" y="88">outside NP entirely</text>
  </g>

  <text class="lbl small" x="20" y="24">The picture if P ≠ NP. If P = NP, the green and blue regions are the same circle.</text>
</svg>
